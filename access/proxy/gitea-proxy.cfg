# ZeroGate Cloud - OAuth2 Proxy Configuration for Gitea
# Enforces Keycloak OIDC Authentication and Role-Based Authorization
# Allowed roles: analyst, admin, auditor (employee is denied)

http_address = "0.0.0.0:4180"
upstreams = [
    "http://gitea:3000"
]

# Provider: Keycloak OpenID Connect
provider = "keycloak-oidc"
client_id = "zerogate-gitea"
# client_secret supplied via OAUTH2_PROXY_CLIENT_SECRET environment variable
# cookie_secret supplied via OAUTH2_PROXY_COOKIE_SECRET environment variable

oidc_issuer_url = "http://localhost:8080/realms/zerogate"
redeem_url = "http://keycloak:8080/realms/zerogate/protocol/openid-connect/token"
validate_url = "http://keycloak:8080/realms/zerogate/protocol/openid-connect/userinfo"
oidc_jwks_url = "http://keycloak:8080/realms/zerogate/protocol/openid-connect/certs"
insecure_oidc_skip_issuer_verification = true

redirect_url = "http://localhost:4181/oauth2/callback"
code_challenge_method = "S256"
scope = "openid email profile"

# Access Matrix: Employee=Denied, Analyst=Allowed, Admin=Allowed, Auditor=Allowed (Read-Only in App)
allowed_roles = [
    "analyst",
    "admin",
    "auditor"
]

allowed_groups = [
    "analyst",
    "admin",
    "auditor"
]

oidc_groups_claim = "roles"

email_domains = [
    "*"
]

# Session & Cookie Security
cookie_secure = false
cookie_httponly = true
cookie_name = "_zg_gitea_oauth2"
cookie_expire = "4h0m0s"
cookie_refresh = "1h0m0s"

# Header Injection for Upstream Application Reverse-Proxy Auth
pass_user_headers = true
set_xauthrequest = true
pass_authorization_header = true
pass_access_token = true
skip_provider_button = true
silence_ping_logging = true
