<agent_config os="Windows">
  <!-- ZeroGate Cloud — Centralized Wazuh Agent Configuration for Windows -->

  <!-- File Integrity Monitoring (FIM) for Designated Confidential Lab Folder -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <auto_ignore>no</auto_ignore>

    <!-- Real-time file integrity monitoring of confidential directory -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Users\Admin\Documents\ZeroGate\data\confidential</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Users\Admin\Documents\ZeroGate\quarantine</directories>

    <!-- Exclude binary diffs for sensitive secret files to prevent leaking content -->
    <nodiff>C:\Users\Admin\Documents\ZeroGate\data\confidential\*.key</nodiff>
    <nodiff>C:\Users\Admin\Documents\ZeroGate\data\confidential\*.secret</nodiff>
  </syscheck>

  <!-- Windows Event Channel Collection (Sysmon Operational Log) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Security Event Channel (Logon and Privilege Escalation) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4624 or EventID=4625 or EventID=4672]</query>
  </localfile>
</agent_config>
