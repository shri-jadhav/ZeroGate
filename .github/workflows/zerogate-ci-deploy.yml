name: ZeroGate Cloud — CI Security Gates & OIDC Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Default least-privilege permissions for all jobs
permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: infra/terraform
  EXPECTED_GITHUB_REPO: shri-jadhav/ZeroGate

jobs:
  security-gates:
    name: Policy-as-Code, Secret Scan, Terraform & DLP Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Security & Verification Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Gate 1 — Terraform Formatting & Syntax Validation
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Gate 2 — Policy-as-Code, Secret Scan, IAM/S3/OIDC/Keycloak & Negative Fixture Checks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m policy.validator

      - name: Gate 3 — DLP Synthetic Benchmark & Email/Upload Unit Regression Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v tests/test_dlp_scanner.py tests/test_upload_quarantine.py tests/test_email_security.py tests/test_phase4_cloud_security.py

  deploy-aws-infra:
    name: AWS OIDC Federated Terraform Deployment
    needs: [security-gates]
    # Strictly prohibit deployment from pull requests, forks, or non-main branches
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'shri-jadhav/ZeroGate' &&
      github.event.pull_request == null
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Authenticate to AWS via GitHub OIDC (AssumeRoleWithWebIdentity — Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_DEPLOY_ROLE_ARN }}
          role-session-name: ZeroGateGitHubActionsOIDC
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify Federated STS Identity & Enforce Least-Privilege Role Boundary
        run: |
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "Authenticated via OIDC as: ${CALLER_ARN}"
          if [[ "${CALLER_ARN}" != *":assumed-role/zerogate-cloud-lab-github-deploy-role/"* ]]; then
            echo "ERROR: Unexpected caller identity for OIDC deployment role"
            exit 1
          fi

      - name: Terraform Init & Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init
          terraform plan -out=tfplan -input=false

      - name: Terraform Apply (Protected Branch & Environment Only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -input=false tfplan
