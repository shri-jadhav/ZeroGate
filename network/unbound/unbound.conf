# ==============================================================================
# ZeroGate Cloud — Unbound DNS Resolver Configuration (Phase 2)
# Architecture: Zero Trust DNS Resolution, DNSSEC Validation & Threat Blocking
# ==============================================================================

server:
  # Process & Directory Configuration
  directory: "/opt/unbound/etc/unbound"
  chroot: ""
  username: "_unbound"

  # Logging & Verbosity
  verbosity: 1
  log-queries: yes
  log-replies: yes
  log-tag-queryreply: yes
  use-syslog: no
  logfile: ""

  # Listening Interfaces
  interface: 0.0.0.0@53
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # Access Control (Default Refuse / Explicit Internal Subnet Allow)
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: 0.0.0.0/0 refuse
  access-control: ::0/0 refuse

  # Security & Privacy Hardening
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  val-clean-additional: yes

  # DNSSEC Validation
  module-config: "validator iterator"
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"

  # Threat Intelligence / Domain Blocklists
  include: "/opt/unbound/etc/unbound/blocklist.conf"

# Upstream Recursive Forwarding for Allowed Public Domains
forward-zone:
  name: "."
  forward-addr: 1.1.1.1
  forward-addr: 8.8.8.8

remote-control:
  control-enable: no
